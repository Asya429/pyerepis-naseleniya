<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Перепись населения</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="header">
        <div class="container">
            <div class="header__content">
                <div class="header__logo">
                    <div class="header__emblem">&#9733;</div>
                    <h1 class="header__title">Перепись населения</h1>
                </div>
                <p class="header__subtitle">Единая система учёта граждан</p>
            </div>
        </div>
    </header>

    <main class="main">
        <div class="container">
            <div class="toolbar">
                <div class="toolbar__search">
                    <input 
                        type="text" 
                        id="searchInput" 
                        class="input" 
                        placeholder="Поиск по ФИО..."
                    >
                    <button type="button" id="searchBtn" class="btn btn--secondary">Найти</button>
                    <button type="button" id="resetBtn" class="btn btn--outline">Сбросить</button>
                </div>
                <a href="add.html" class="btn btn--primary">+ Добавить запись</a>
            </div>

            <div class="stats">
                <p>Всего записей: <strong id="totalCount">0</strong></p>
            </div>

            <div class="table-wrapper">
                <table class="table" id="citizensTable">
                    <thead>
                        <tr>
                            <th>№</th>
                            <th>ФИО</th>
                            <th>Дата рождения</th>
                            <th>Пол</th>
                            <th>Город</th>
                            <th>Действия</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                        <!-- Данные будут загружены через JavaScript -->
                    </tbody>
                </table>
            </div>

            <div id="emptyMessage" class="empty-message" style="display: none;">
                <p>Записи не найдены</p>
                <a href="add.html" class="btn btn--primary">Добавить первую запись</a>
            </div>
        </div>
    </main>

    <footer class="footer">
        <div class="container">
            <p>&copy; 2026 Перепись населения. Все права защищены.</p>
        </div>
    </footer>

    <script src="js/storage.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
